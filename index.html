<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <link rel="stylesheet" href="./Coming Soon.css">
</head>
<body>
  <div class="container">
    <h1>Coming Soon</h1>
    <div class="countdown">
      <div class="time-box">
        <div id="days" class="number">00</div>
        <div class="label">Days</div>
      </div>
      <div class="time-box">
        <div id="hours" class="number">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="time-box">
        <div id="minutes" class="number">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="time-box">
        <div id="seconds" class="number">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>
  </div>

    <script src="./Coming Soon.js"></script>

</body>
</html>
